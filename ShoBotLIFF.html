<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しょぼっと - 書籍登録</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
</head>
<body>

  <!-- 1. 書籍登録画面(LF1) + スキャナー統合 -->
  <div id="screen-lf1">
    <h1>書籍登録</h1>

    <!-- カメラ映像領域 -->
    <div id="interactive" class="viewport"></div>

    <!-- 手動ISBN入力フォーム -->
    <div class="manual-input-container">
      <input type="text" id="manualIsbnInput" class="manual-input-field"
       placeholder="ISBN(978/979で始まる13桁)を入力" maxlength="13" pattern="\d*" inputmode="numeric"/>
      <button type="button" class="btn-submit" onclick="addManualIsbn()">追加</button>
    </div>

    <!-- 書籍区分(一括指定) -->
    <div class="card">
      <label class="label-title">書籍区分(一括指定)</label>
      <select id="bulkCategory" class="select-category" onchange="applyBulkCategory()">
        <option value="未設定">書籍区分を選択</option>
        <option value="漫画">漫画</option>
        <option value="小説">小説</option>
        <option value="その他">その他</option>
      </select>
    </div>

    <!-- スキャン結果一覧 -->
    <div class="card">
      <ul id="isbnList" class="isbn-list"></ul>
    </div>

    <!-- 下部固定ボタン -->
    <div class="footer-bar">
      <button id="btnSubmitLf1" class="btn-submit" onclick="submitScanList()" disabled>登録</button>
    </div>
  </div>

  <!-- 2. 登録結果画面(LF2) -->
  <div id="screen-lf2" style="display: none;">
    <div class="card">
      <label class="label-title">登録書籍一覧</label>
      <ul id="registeredResultList" class="result-list"></ul>
    </div>

    <div class="footer-bar">
      <button class="btn-submit" onclick="goToLf1ForMore()">追加登録</button>
      <button class="btn-secondary" onclick="closeLiff()">トークへ戻る</button>
    </div>
  </div>

  <!-- 3. ダイアログ -->
  <div id="modalOverlay" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <p id="modalMessage" class="modal-text"></p>
      <div id="modalButtons" class="modal-buttons">
        <button class="modal-btn" onclick="closeModal()">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 4. 登録中の画面操作ロック用オーバーレイ -->
  <div id="loadingOverlay" class="loading-overlay" style="display: none;"></div>

  <script src="app.js"></script>
</body>
</html>
