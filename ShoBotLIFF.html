<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しょぼっと - 書籍登録</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
</head>
<body>

  <!-- 書籍登録画面(LF1) -->
  <div id="screen-lf1">
    <h1>書籍登録</h1>

    <!-- カメラ映像領域 -->
    <div id="interactive" class="viewport"></div>

    <!-- 手動ISBN入力フォーム -->
    <div class="manual-input-container">
      <input type="text" id="manualIsbnInput" class="manual-input-field"
       placeholder="ISBN(978/979で始まる13桁)を入力" maxlength="13" pattern="\d*" inputmode="numeric"/>
      <button type="button" class="btn-submit" onclick="addManualIsbn()">追加</button>
    </div>

    <!-- 書籍区分(一括指定) & 読書ステータス -->
    <div class="card" id="bulk-card">
      <div class="bulk-group">
        <label class="label-title">書籍区分</label>
        <select id="bulkCategory" class="select-category" onchange="applyBulkSettings()">
          <option value="未設定">区分を選択</option>
          <option value="漫画">漫画</option>
          <option value="小説">小説</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="bulk-group">
        <label class="label-title">読書ステータス</label>
        <select id="bulkStatus" class="select-category">
          <option value="読了">読了</option>
          <option value="未読">未読</option>
          <option value="読み途中">読み途中</option>
        </select>
      </div>
    </div>

    <!-- スキャン結果一覧 -->
    <div class="card">
      <label class="label-title">読み込み冊数 ： <span id="scanCount">0</span>冊</label>
      <ul id="isbnList" class="isbn-list"></ul>
    </div>

    <!-- 下部固定ボタン -->
    <div class="footer-bar">
      <button id="btnSubmitLf1" class="btn-submit" onclick="submitScanList()" disabled>登録</button>
    </div>
  </div>

  <!-- 登録結果画面(LF2) -->
  <div id="screen-lf2" style="display: none;">
    <div class="card">
      <label class="label-title">登録書籍一覧</label>
      <ul id="registeredResultList" class="result-list"></ul>
    </div>

    <div class="footer-bar">
      <button class="btn-submit" onclick="goToLf1ForMore()">追加登録</button>
      <button class="btn-secondary" onclick="closeLiff()">トークへ戻る</button>
    </div>
  </div>

  <!-- 蔵書データ修正画面(LF3) (単行本) -->
  <div id="screen-lf3" style="display: none;">
    <h1>蔵書データ修正</h1>

    <div class="card">
      <div class="form-group">
        <label class="label-title">書籍タイトル</label>
        <input type="text" id="singleEditTitleInput" class="input-text" placeholder="タイトルを入力" />
      </div>

      <div class="form-group">
        <label class="label-title">巻数</label>
        <input type="number" id="singleEditVolumeInput" class="input-text" placeholder="数字のみ" />
      </div>

      <div class="form-group">
        <label class="label-title">シリーズ名</label>
        <select id="singleEditSeriesSelect" class="select-category" onchange="toggleCustomInput('singleEditSeriesSelect', 'singleEditSeriesCustomContainer')"></select>
        <div id="singleEditSeriesCustomContainer" style="display: none;">
          <input type="text" id="singleEditSeriesCustomInput" class="input-text mt-2" placeholder="新しいシリーズ名を入力" />
        </div>
      </div>

      <div class="form-group">
        <label class="label-title">著者名</label>
        <select id="singleEditAuthorSelect" class="select-category" onchange="toggleCustomInput('singleEditAuthorSelect', 'singleEditAuthorCustomContainer')"></select>
        <div id="singleEditAuthorCustomContainer" style="display: none;">
          <input type="text" id="singleEditAuthorCustomInput" class="input-text mt-2" placeholder="新しい著者名を入力" />
        </div>
      </div>

      <div class="form-group">
        <label class="label-title">出版レーベル</label>
        <select id="singleEditLabelSelect" class="select-category" onchange="toggleCustomInput('singleEditLabelSelect', 'singleEditLabelCustomContainer')"></select>
        <div id="singleEditLabelCustomContainer" style="display: none;">
          <input type="text" id="singleEditLabelCustomInput" class="input-text mt-2" placeholder="新しい出版レーベルを入力" />
        </div>
      </div>

      <div class="form-group">
        <label class="label-title">書籍区分</label>
        <select id="singleEditCategory" class="select-category">
          <option value="漫画">漫画</option>
          <option value="小説">小説</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="form-group">
        <label class="label-title">ステータス</label>
        <select id="singleEditStatus" class="select-category">
          <option value="読了">読了</option>
          <option value="未読">未読</option>
          <option value="読み途中">読み途中</option>
        </select>
      </div>
    </div>

    <div class="footer-bar">
      <button class="btn-submit" onclick="saveSingleEdit()">変更内容を保存する</button>
      <button class="btn-secondary" onclick="closeSingleEdit()">変更せずに戻る</button>
      <button class="btn-delete" onclick="deleteSingleBook()">この本を削除する</button>
    </div>
  </div>

  <!-- 蔵書データ修正画面(LF3) (シリーズ) -->
  <div id="screen-lf4" style="display: none;">
    <h1>シリーズデータ修正</h1>

    <div class="card">
      <div class="form-group">
        <label class="label-title">シリーズタイトル</label>
        <input type="text" id="seriesEditTitleInput" class="input-text" placeholder="シリーズ名を入力" />
      </div>
      <div class="result-cat" style="margin-top: 6px;">
        <span id="seriesEditAuthor">著者名</span> / <span id="seriesEditLabel">出版レーベル</span>
      </div>
    </div>

    <!-- 一括変更フォーム・アコーディオン（既存のまま） -->
    <div class="card">
      <div style="margin-bottom: 8px;">
        <label class="label-title">書籍区分 (一括変更)</label>
        <select id="seriesBulkCategory" class="select-category" onchange="applySeriesBulkCategory()">
          <option value="未選択">区分を選択</option>
          <option value="漫画">漫画</option>
          <option value="小説">小説</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div>
        <label class="label-title">ステータス (一括変更)</label>
        <select id="seriesBulkStatus" class="select-category" onchange="applySeriesBulkStatus()">
          <option value="未選択">ステータスを選択</option>
          <option value="読了">読了</option>
          <option value="未読">未読</option>
          <option value="読み途中">読み途中</option>
        </select>
      </div>
    </div>

    <div id="seriesAccordionContainer"></div>

    <div class="footer-bar">
      <button class="btn-submit" onclick="saveSeriesEdit()">変更内容を保存する</button>
      <button class="btn-secondary" onclick="closeSeriesEdit()">変更せずに戻る</button>
      <button class="btn-delete" onclick="deleteSeriesAll()">このシリーズの本を全て削除する</button>
    </div>
  </div>
