<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登録スキャナー</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
</head>
<body>

  <!-- カメラ映像領域 -->
  <div id="interactive" class="viewport"></div>

  <!-- スキャン結果リアルタイム表示領域 -->
  <div class="list-container">
    <div class="list-title">スキャン済み一覧 (<span id="count">0</span>冊)</div>
    <ul id="scanList" class="scan-list"></ul>
  </div>

  <!-- 終了ボタン -->
  <div class="footer">
    <button type="button" class="btn-close" onclick="window.close()">スキャンを終了して戻る</button>
  </div>
  
  <!-- ダイアログ（フリーズ防止用） -->
  <div id="modalOverlay">
    <div class="modal-box">
      <p id="modalMessage"></p>
      <button type="button" class="modal-btn" onclick="closeModal()">OK</button>
    </div>
  </div>

  <!-- app.js読み込み -->
  <script src="app.js"></script>
</body>
</html>
