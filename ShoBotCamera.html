<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #interactive.viewport { width: 100%; height: 100%; position: relative; }
    #interactive.viewport video, #interactive.viewport canvas { width: 100%; height: 100%; object-fit: cover; }
    #error-log { color: #ff6b6b; padding: 12px; font-size: 13px; font-family: sans-serif; word-break: break-all; }
  </style>
</head>
<body>
  <div id="interactive" class="viewport"></div>
  <div id="error-log"></div>

  <script>
    let lastScannedTime = 0;

    function logError(msg) {
      document.getElementById('error-log').innerText = msg;
    }

    // カメラ起動処理
    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector('#interactive'),
        constraints: {
          facingMode: "environment", // 外カメラ（背面）を指定
          width: { min: 640, ideal: 1280 },
          height: { min: 480, ideal: 720 }
        }
      },
      decoder: { readers: ["ean_reader"] }
    }, function(err) {
      if (err) {
        console.error("Camera Init Error:", err);
        logError("カメラエラー: " + (err.name || "") + " - " + (err.message || err));
        return;
      }
      Quagga.start();
    });

    // バーコード検知時の処理
    Quagga.onDetected(function(result) {
      const now = Date.now();
      if (now - lastScannedTime < 1500) return;

      const code = result.codeResult.code;
      if (code && code.length === 13 && (code.startsWith("978") || code.startsWith("979"))) {
        lastScannedTime = now;
        window.parent.postMessage({ type: "SCAN_ISBN", isbn: code }, "*");
      }
    });
  </script>
</body>
</html>
