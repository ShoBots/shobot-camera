<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #interactive.viewport { width: 100%; height: 100%; position: relative; }
    #interactive.viewport video, #interactive.viewport canvas { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div id="interactive" class="viewport"></div>

  <script>
    // カメラ起動処理
    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector('#interactive'),
        constraints: { facingMode: "environment" }
      },
      decoder: { readers: ["ean_reader"] } // JAN/ISBN (EAN-13)
    }, function(err) {
      if (err) {
        console.error("Camera Init Error:", err);
        return;
      }
      Quagga.start();
    });

    // バーコード検知時の処理
    Quagga.onDetected(function(result) {
      const now = Date.now();
      // 前回の読み取りから1.5秒以内の連打検出は無視する
      if (now - lastScannedTime < 1500) return;
      
      const code = result.codeResult.code;
      // 978 または 979 で始まる13桁のISBNコードのみ親画面（GAS）へ送信
      if (code && code.length === 13 && (code.startsWith("978") || code.startsWith("979"))) {
        window.parent.postMessage({ type: "SCAN_ISBN", isbn: code }, "*");
      }
    });
  </script>
</body>
</html>
