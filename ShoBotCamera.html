<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
</head>
<body>

  <!-- カメラ映像領域 -->
  <div id="interactive" class="viewport"></div>

  <!-- スキャン結果リアルタイム表示領域 -->
  <div class="list-container">
    <div class="list-title">スキャン済み一覧 (<span id="count">0</span>冊)</div>
    <ul id="scanList" class="scan-list"></ul>
  </div>

  <!-- 終了ボタン -->
  <div class="footer">
    <button type="button" class="btn-close" onclick="window.close()">スキャンを終了して戻る</button>
  </div>

  <script>
    const MAX_BOOKS = 20; // 最大上限数
    let lastScannedTime = 0;
    const scannedSet = new Set();
  
    // 画面読み込み時にURLパラメータから既存のISBNを引き継ぐ
    window.addEventListener("DOMContentLoaded", function() {
      const params = new URLSearchParams(window.location.search);
      const existingIsbnsParam = params.get("isbns");
  
      if (existingIsbnsParam) {
        const existingIsbns = existingIsbnsParam.split(",");
        existingIsbns.forEach(isbn => {
          if (isbn && !scannedSet.has(isbn)) {
            scannedSet.add(isbn);
            renderItem(isbn, true); // 引き継ぎ分として画面描画
          }
        });
      }
    });
  
    // カメラ起動処理
    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector('#interactive'),
        constraints: { facingMode: "environment" }
      },
      decoder: { readers: ["ean_reader"] }
    }, function(err) {
      if (!err) Quagga.start();
    });
  
    // バーコード検知時処理
    Quagga.onDetected(function(result) {
      const now = Date.now();
      if (now - lastScannedTime < 1500) return; // 連続読み取り防止
  
      const code = result.codeResult.code;
      if (code && code.length === 13 && (code.startsWith("978") || code.startsWith("979"))) {
        lastScannedTime = now;
  
        // 重複チェック
        if (scannedSet.has(code)) {
          alert("既に同じISBNコードが入力されています");
          return;
        }
  
        // ★上限チェック（20冊を超えそうになった場合）
        if (scannedSet.size >= MAX_BOOKS) {
          alert("読み込み件数が上限(" + MAX_BOOKS + "冊)に達しています。\n一度登録をしてください");
          return;
        }
  
        scannedSet.add(code);
  
        // 1. スキャナー画面のリストに追加表示
        renderItem(code, false);
  
        // 2. 裏のGAS（親画面）へISBNをリアルタイム送信
        const targetWindow = window.opener || window.parent;
        if (targetWindow && targetWindow !== window) {
          targetWindow.postMessage({ type: "SCAN_ISBN", isbn: code }, "*");
        }
      }
    });
  
    // リストにアイテムを追加描画する関数
    function renderItem(isbn, isInitial) {
      const listEl = document.getElementById("scanList");
      const countEl = document.getElementById("count");
      
      const li = document.createElement("li");
      li.className = "scan-item";
      
      // 引き継ぎ分と新規スキャン分でラベル表示を変える
      const tagText = isInitial ? "追加済み(既存)" : "追加済み";
      li.innerHTML = `<span>${isbn}</span><span style="color:#aabb88; font-weight:bold;">${tagText}</span>`;
      
      listEl.appendChild(li); // 古い順（下に追加）
      countEl.textContent = scannedSet.size;
    }
  
    // 「スキャンを終了して戻る」ボタン処理
    function closeAndReturn() {
      try { Quagga.stop(); } catch(e) {}
      window.close();
    }
  </script>
</body>
</html>
